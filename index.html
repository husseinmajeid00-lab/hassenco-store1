<!DOCTYPE html>

    <title>Hassenco Store</title>
    <style>
        .product-card img { width: 100%; height: 200px; object-fit: cover; }
        .search-bar { width: 80%; max-width: 400px; padding: 15px; margin: 20px auto; display: block; border-radius: 25px; border: 2px solid #d4af37; background: #1a1a1a; color: #fff; text-align: center; }
        .contact-options { display: flex; gap: 5px; justify-content: center; margin-top: 10px; }
        .btn-partner { background-color: #25d366; color: #ffffff; padding: 8px; text-decoration: none; border-radius: 5px; flex: 1; text-align: center; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px; }
    </style>
</head>

        function loadProducts() {
            products.forEach(p => {
                const message = encodeURIComponent(`مرحباً، أود استفسار/طلب منتج: ${p.name}`);
                const card = `
                    <div class="product-card">
                        <img src="${p.file}" alt="${p.name}">
                        <h3>${p.name}</h3>
                        <p>${p.price}</p>
                        <div class="contact-options">
                            <a href="https://wa.me/96181654417?text=${message}" class="btn-partner">رقمي</a>
                            <a href="https://wa.me/96170726180?text=${message}" class="btn-partner">شريكي</a>
                        </div>
                    </div>
                `;
                document.getElementById(p.category).innerHTML += card;
            });
        }
        loadProducts();

        function searchProducts() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.querySelectorAll('.product-card');
            cards.forEach(card => {
                let name = card.querySelector('h3').innerText.toLowerCase();
                card.style.display = name.includes(input) ? "" : "none";
            });
        }
    </script>
