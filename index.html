<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hassenco Store</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); 
            color: #fff; 
            font-family: system-ui, -apple-system, sans-serif; 
            margin: 0; 
            padding: 15px; 
            direction: rtl; 
            min-height: 100vh;
        }
        .header-title {
            text-align: center;
            color: #f8b500;
            margin-bottom: 5px;
            font-size: 1.8rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .search-bar { 
            width: 90%; 
            max-width: 400px; 
            padding: 12px 20px; 
            margin: 15px auto 25px; 
            display: block; 
            border-radius: 25px; 
            border: 2px solid #f8b500; 
            background: rgba(0, 0, 0, 0.6); 
            color: #fff; 
            text-align: center; 
            font-size: 1rem; 
            outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .products-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); 
            gap: 15px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        .product-card { 
            background: #ffffff; 
            border-radius: 15px; 
            padding: 12px; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .product-card:active { transform: scale(0.98); }
        .product-card img { 
            width: 100%; 
            height: 150px; 
            object-fit: cover; 
            border-radius: 10px; 
            background-color: #f0f0f0; 
        }
        .product-card h3 { 
            font-size: 0.95rem; 
            margin: 10px 0 5px; 
            color: #2c3e50; 
            font-weight: bold;
        }
        .price { 
            color: #e67e22; 
            font-weight: 800; 
            margin-bottom: 10px; 
            font-size: 1.1rem; 
        }
        .contact-options { display: flex; gap: 6px; justify-content: center; }
        .btn-partner { 
            background: linear-gradient(45deg, #11998e, #38ef7d); 
            color: #fff; 
            padding: 8px 4px; 
            border-radius: 8px; 
            text-decoration: none; 
            font-size: 0.85rem; 
            flex: 1; 
            font-weight: bold; 
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <h1 class="header-title">🛍️ Hassenco Store</h1>
    <input type="text" id="searchInput" oninput="searchProducts()" placeholder="🔍 ابحث عن منتج..." class="search-bar">

    <main class="products-grid" id="mainGrid"></main>

    <script>

            { name: "قوالب صنع سامبوسك", price: "$3.00", img: "1 (4).jpeg" },

            { name: "مسطرة سيلكن", price: "$0.75", img: "1 (9).jpeg" },
            { name: "غورد مياه بلاستيك", price: "$7.00", img: "1 (10).jpeg" },
            { name: "علبة ٤ محايات و برايات", price: "$1.25", img: "1 (11).jpeg" },
            { name: "علبة تلوين مائي", price: "$2.00", img: "1 (12).jpeg" },
            { name: "لوح وايت بورد", price: "$5.00", img: "1 (13).jpeg" },

            { name: "مسكرة سيروم", price: "$4.00", img: "1 (15).jpeg" },

            { name: "دفتر جامعي 144", price: "$5.00", img: "1 (19).jpeg" },

            { name: "طقم صحون مربع", price: "$50.00", img: "1 (36).jpeg" },
            { name: "مشك جلي", price: "$14.00", img: "1 (37).jpeg" },
            { name: "طقم جاط", price: "$6.50", img: "1 (38).jpeg" },
            { name: "ستاند معلاق", price: "$5.00", img: "1 (39).jpeg" },
            { name: "عصارة يدوية", price: "$3.00", img: "1 (40).jpeg" }
        ];

        const grid = document.getElementById('mainGrid');
        products.forEach(p => {
            const msg = encodeURIComponent(`مرحباً، أود الاستفسار عن: ${p.name}`);
            grid.innerHTML += `
                <div class="product-card">
                    <img src="${p.img}" alt="${p.name}">
                    <h3>${p.name}</h3>
                    <div class="price">${p.price}</div>
                    <div class="contact-options">
                        <a href="https://wa.me/96181654417?text=${msg}" class="btn-partner" target="_blank">رقم 1</a>
                        <a href="https://wa.me/96170726180?text=${msg}" class="btn-partner" target="_blank">رقم 2</a>
                    </div>
                </div>
            `;
        });

        function searchProducts() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.querySelectorAll('.product-card');
            cards.forEach(card => {
                let name = card.querySelector('h3').innerText.toLowerCase();
                card.style.display = name.includes(input) ? "" : "none";
            });
        }
    </script>
</body>
</html>
